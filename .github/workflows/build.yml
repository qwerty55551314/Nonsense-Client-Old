name: Java CI with Gradle

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 深度修复核心：
    # 1. 注入 Minecraft 客户端构建最常用的伪造路径环境变量，防止 build.gradle 报 null 错误
    # 2. 通过 -P 注入常用变量覆盖，强行通过 Gradle 评估期
    # 3. 使用 compileJava 只编译核心代码，直接跳过后期极其复杂的混淆和反混淆阶段
    - name: Build with Gradle
      env:
        _JAVA_OPTIONS: "-Xms1024m -Xmx3072m"
        MINECRAFT_CLIENT_PATH: "."
        MC_VERSION: "1.8.9"
        MCOWNER: "runner"
      run: |
        ./gradlew compileJava build -x test -Pminecraft_dir="." -Pclient_path="." --no-daemon --stacktrace
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nonsense-Client-Build
        path: |
          build/libs/*.jar
          build/classes/java/main/**/*.class