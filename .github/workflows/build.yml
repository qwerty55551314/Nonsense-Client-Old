name: Java CI with Gradle

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: 

jobs:
  build:
    # 修复核心：使用更老、兼容性更好的系统环境，防止老版 MCP Gradle 构建因为系统库太新而报错
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 升级至 v5 版本，移除过时警告
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 针对老旧 MCP 客户端的特殊构建命令。如果普通的 build 报错，它能强制跳过不必要的混淆校验
    - name: Build with Gradle
      run: ./gradlew setupDevWorkspace build --no-daemon

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nonsense-Client-Build
        path: build/libs/*.jar